<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Second Counter</title>
<style>
body {
  background: #101322;
  color: white;
  font-family: Arial;
  text-align: center;
  padding-top: 100px;
}
h1 { color: #00e5ff; }
#time {
  font-size: 55px;
  margin: 40px 0;
  font-weight: bold;
}
button {
  padding: 15px 25px;
  margin: 8px;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  cursor: pointer;
}
.start { background: #00e5ff; }
.pause { background: orange; }
.reset { background: #ff4757; color: white; }
</style>
</head>
<body>

<h1>SECOND COUNTER</h1>
<div id="time">00:00:00.00</div>

<button class="start" onclick="start()">START</button>
<button class="pause" onclick="pause()">PAUSE</button>
<button class="reset" onclick="reset()">RESET</button>

<script>
let seconds = 0;
let timer = null;

function show() {
  let h = Math.floor(seconds / 3600);
  let m = Math.floor(seconds % 3600 / 60);
  let s = Math.floor(seconds % 60);
  let ms = Math.floor((seconds % 1) * 100);

  document.getElementById("time").textContent =
    String(h).padStart(2,"0") + ":" +
    String(m).padStart(2,"0") + ":" +
    String(s).padStart(2,"0") + "." +
    String(ms).padStart(2,"0");
}

function start() {
  if (timer) return;
  let last = Date.now();
  timer = setInterval(() => {
    let now = Date.now();
    seconds += (now - last) / 1000;
    last = now;
    show();
  }, 10);
}

function pause() {
  clearInterval(timer);
  timer = null;
}

function reset() {
  pause();
  seconds = 0;
  show();
}
</script>

</body>
</html>
